spring.application.name=jdr-platform

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jdr}
spring.datasource.username=${DB_USER:jdr}
spring.datasource.password=${DB_PASSWORD:jdr}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# OAuth2 : les identifiants viennent de l'environnement (SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_<FOURNISSEUR>_CLIENT_ID|CLIENT_SECRET).
# Les valeurs par défaut permettent de démarrer sans identifiants (la connexion échouera chez le fournisseur).
app.auth.success-url=${APP_AUTH_SUCCESS_URL:/}
app.auth.failure-url=${APP_AUTH_FAILURE_URL:/login}

spring.security.oauth2.client.registration.google.client-id=not-configured
spring.security.oauth2.client.registration.google.client-secret=not-configured
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.discord.client-id=not-configured
spring.security.oauth2.client.registration.discord.client-secret=not-configured
spring.security.oauth2.client.registration.discord.provider=discord
spring.security.oauth2.client.registration.discord.client-name=Discord
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.provider.discord.authorization-uri=${DISCORD_AUTHORIZATION_URI:https://discord.com/oauth2/authorize}
spring.security.oauth2.client.provider.discord.token-uri=${DISCORD_TOKEN_URI:https://discord.com/api/oauth2/token}
spring.security.oauth2.client.provider.discord.user-info-uri=${DISCORD_USER_INFO_URI:https://discord.com/api/users/@me}
spring.security.oauth2.client.provider.discord.user-name-attribute=id
