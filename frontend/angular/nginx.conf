server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
  }

  # Flux OAuth2 : démarrage de la connexion et retour du fournisseur.
  location /oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
  }

  location /login/oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
